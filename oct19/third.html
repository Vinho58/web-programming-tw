<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
th {
  background-color: #444;
  color: white;
  padding: 20px;
}

td {
  background-color: lightgray;
  text-align: center;
  padding: 20px;
}
</style>
</head>
<body>

<table>
  <tr>
    <th></th>
    <th scope="col">Monday</th>
    <th scope="col">Tuesday</th>
    <th scope="col">Wednesday</th>
  </tr>
  <tr>
    <th scope="row">1pm</th>
    <td>Math</td>
    <td>Science</td>
    <td>Art</td>
  </tr>
  <tr>
    <th scope="row">2pm</th>
    <td>Science</td>
    <td>Writing</td>
    <td>Reading</td>
  </tr>
</table>

</body>
</html>
